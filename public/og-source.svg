<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#2c4718"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a7c28" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4a7c28" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2d5016"/><stop offset="25%" stop-color="#1a365d"/>
      <stop offset="50%" stop-color="#4a1d96"/><stop offset="75%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#967117"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="630"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="630" fill="url(#bg)"/>
    <circle cx="1080" cy="90"  r="330" fill="url(#glowA)"/>
    <circle cx="980"  cy="600" r="260" fill="url(#glowB)"/>

    <g font-family="AppleGothic, 'Apple SD Gothic Neo', sans-serif">
      <rect x="88" y="118" width="286" height="48" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.20"/>
      <text x="112" y="150" font-size="21" font-weight="700" fill="#ffffff" fill-opacity="0.90">전역일부터 휴가까지</text>

      <text x="88" y="298" font-size="86" font-weight="900" fill="#ffffff" letter-spacing="-3">슬기로운 병영생활</text>
      <text x="90" y="352" font-size="30" font-weight="500" fill="#ffffff" fill-opacity="0.70">군 생활의 든든한 동반자</text>

      <g font-size="23" font-weight="700" fill="#ffffff">
        <rect x="88"  y="408" width="176" height="52" rx="14" fill="#ffffff" fill-opacity="0.11" stroke="#ffffff" stroke-opacity="0.13"/>
        <text x="112" y="441">전역 D-Day</text>
        <rect x="276" y="408" width="152" height="52" rx="14" fill="#ffffff" fill-opacity="0.11" stroke="#ffffff" stroke-opacity="0.13"/>
        <text x="300" y="441">진급 일정</text>
        <rect x="440" y="408" width="152" height="52" rx="14" fill="#ffffff" fill-opacity="0.11" stroke="#ffffff" stroke-opacity="0.13"/>
        <text x="464" y="441">휴가 관리</text>
        <rect x="604" y="408" width="178" height="52" rx="14" fill="#ffffff" fill-opacity="0.11" stroke="#ffffff" stroke-opacity="0.13"/>
        <text x="628" y="441">월급 · 적금</text>
        <rect x="794" y="408" width="140" height="52" rx="14" fill="#ffffff" fill-opacity="0.11" stroke="#ffffff" stroke-opacity="0.13"/>
        <text x="818" y="441">커뮤니티</text>
      </g>

      <text x="88" y="548" font-size="20" font-weight="600" fill="#ffffff" fill-opacity="0.42">miliyday.vercel.app</text>
    </g>
    <rect x="0" y="614" width="1200" height="16" fill="url(#bar)"/>
  </g>
</svg>
